services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────
  - type: web
    name: ai-trainplot-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.0

  # ── Frontend (React/Vite) ──────────────────────────────────────────
  - type: web
    name: ai-trainplot-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ai-trainplot-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
